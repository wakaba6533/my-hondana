<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>本棚</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header>
            <h1>📚 本棚</h1>
        </header>
        <main>
            <div class="toolbar">
                <input type="search" id="searchInput" placeholder="検索" />
                <select id="sortSelect">
                    <option value="newest">新しい順</option>
                    <option value="oldest">古い順</option>
                    <option value="title">タイトル順</option>
                    <option value="author">著者順</option>
                </select>
                <select id="statusSelect">
                    <option value="owned">所有中</option>
                    <option value="sold">売却済み</option>
                    <option value="all">すべて</option>
                </select>
            </div>
            <button id="scanButton">📷 バーコード読取</button>
            <button id="devAddButton">🧪 開発用追加</button>
            <div class="table-container">
                <div class="book-header">
                    <div>表紙</div>
                    <div>タイトル</div>
                    <div>作者</div>
                    <div>状態</div>
                    <div>登録日</div>
                </div>
                <div id="bookList">
                    <p class="empty">まだ本はありません</p>
                </div>
            </div>
            <div id="scannerModal" class="hidden">
                <div class="scanner-container">
                    <div id="reader"></div>
                    <button id="closeScanner">閉じる</button>
                </div>
            </div>
        </main>
        <script src="https://unpkg.com/html5-qrcode"></script>
        <script src="js/scanner.js"></script>
        <script src="js/db.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
