<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>本棚</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header class="app-header">
            <h1>My本棚</h1>
            <div class="add-buttons">
                <button id="scanButton">❘❙❚❙❘</button>
                <button id="manualAddButton">✏️</button>
                <button id="devAddButton">⚒️</button>
            </div>
        </header>
        <main>
            <div class="toolbar">
                <input type="search" id="searchInput" placeholder="検索" />
            </div>
            <div class="table-container">
                <div class="book-header">
                    <div id="statusHeader" class="status-filter">📗</div>
                    <div class="sortable" data-sort="title">タイトル</div>
                    <div class="sortable" data-sort="author">著者</div>
                    <div class="sortable" data-sort="createdAt">更新日</div>
                </div>
                <div id="bookList">
                    <p class="empty">まだ本はありません</p>
                </div>
            </div>
            <div id="scannerModal" class="hidden">
                <div class="scanner-container">
                    <div id="reader"></div>
                    <button id="closeScanner">閉じる</button>
                </div>
            </div>
        </main>
        <script src="https://unpkg.com/html5-qrcode"></script>
        <script src="js/scanner.js"></script>
        <script src="js/db.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
