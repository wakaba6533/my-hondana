<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>本棚</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#f8f6ef" />
    </head>
    <body>
        <header class="app-header">
            <h1>My本棚</h1>
            <div class="add-buttons">
                <button id="addButton">＋</button>
            </div>
        </header>
        <main>
            <div class="toolbar">
                <input type="search" id="searchInput" placeholder="検索" />
            </div>
            <div class="table-container">
                <div class="book-header">
                    <div id="statusHeader" class="status-filter">📗</div>
                    <div class="sortable" data-sort="title">タイトル</div>
                    <div class="sortable" data-sort="author">著者</div>
                    <div class="sortable" data-sort="createdAt">更新日</div>
                </div>
                <div id="bookList">
                    <p class="empty">まだ本はありません</p>
                </div>
            </div>
        </main>
        <script src="js/app-state.js"></script>
        <script src="js/db.js"></script>
        <script src="js/app-elements.js"></script>
        
        <script src="js/app.js"></script>
        <script src="js/pwa.js"></script>
    </body>
</html>
