<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>本を登録</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <h1>本を登録</h1>

</header>

<main>

    <form id="bookForm">

        <label>

            タイトル

            <input
                type="text"
                id="title"
                required
            >

        </label>

        <label>

            著者

            <input
                type="text"
                id="author"
            >

        </label>

        <label>

            ISBN

            <input
                type="text"
                id="isbn"
            >

        </label>

        <button type="submit">
            登録
        </button>

        <button
            type="button"
            id="cancelButton"
        >
            キャンセル
        </button>

    </form>

</main>

<script src="js/db.js"></script>
<script src="js/add.js"></script>

</body>

</html>
