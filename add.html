<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>本を登録</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#f8f6ef" />
    </head>
    <body>
        <header>
            <h1>本を登録</h1>
        </header>
        <div id="scannerModal" class="hidden">
            <div class="scanner-container">
                <div id="reader"></div>
                <button type="button" id="closeScanner">
                    閉じる
                </button>
            </div>
        </div>
        <main>
            <form id="bookForm">
                <label>
                    タイトル
                    <input type="text" id="title" required />
                </label>
                <label>
                    著者
                    <input type="text" id="author" />
                </label>
                <label>
                    ISBN
                    <div class="isbn-row">
                        <input type="text" id="isbn" />
                        <button type="button" id="scanButton">📷</button>
                        <button type="button" id="fetchButton">🔍</button>
                    </div>
                </label>
                <label>
                    シリーズ
                    <input id="series">
                </label>
                <small id="seriesMessage"></small>
                <div id="seriesSection" class="series-section hidden">
                    <div class="series-title">シリーズ候補</div>
                    <div id="seriesCandidate"></div>
                </div>
                <img
                    id="thumbnail"
                    src=""
                    alt="表紙"
                    style="display: none; width: 160px; margin: 16px auto"
                />
                <button id="saveButton" type="submit">登録</button>
                <button type="button" id="cancelButton">キャンセル</button>
            </form>
        </main>
        <script src="https://unpkg.com/html5-qrcode"></script>

        <script src="js/app-state.js"></script>
        <script src="js/db.js"></script>
        <script src="js/app-elements.js"></script>

        <script src="js/series.js"></script>
        <script src="js/book-api.js"></script>
        <script src="js/scanner.js"></script>
        <script src="js/add-form.js"></script>
        <script src="js/add.js"></script>
        <script src="js/pwa.js"></script>
    </body>
</html>
